# Actions are pinned to full commit SHAs (resolved from their v4 tags on 2026-10-27).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Lockfile only, official registry, no lifecycle scripts (openclaw, @google/genai,
      # protobufjs and tree-sitter-bash declare install scripts; they are deliberately skipped).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit --pretty false -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Compiled regression tests
        run: |
          node --test dist/src/agent-task-delivery.test.js
          node --test dist/src/ocr.test.js
          node --test dist/src/request-context.test.js
