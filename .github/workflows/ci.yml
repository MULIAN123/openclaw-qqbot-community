# Actions are pinned to full commit SHAs (resolved from their v4 tags on 2026-10-27).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['24']
    # bash on both OSes: GitHub runs it with -eo pipefail, so any failing command fails the step
    # (Windows' default pwsh only reports the last command's exit code).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Lockfile only, official registry, no lifecycle scripts (openclaw, @google/genai,
      # protobufjs and tree-sitter-bash declare install scripts; they are deliberately skipped).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

      # Read-only: shows which precondition of scripts/openclaw-delivery-queue-loader.mjs holds,
      # since the loader deliberately reports only a generic error.
      - name: Diagnose OpenClaw delivery-queue chunk (read-only)
        run: |
          node -e '
            const fs = require("node:fs"), path = require("node:path");
            const m = path.resolve("node_modules"), o = path.join(m, "openclaw"), d = path.join(o, "dist");
            for (const p of [m, o, d]) {
              let s; try { s = fs.lstatSync(p); } catch { console.log(p, "missing"); continue; }
              console.log(path.relative(".", p), "dir=" + s.isDirectory(), "symlink=" + s.isSymbolicLink());
            }
            try { const pkg = JSON.parse(fs.readFileSync(path.join(o, "package.json"), "utf8")); console.log("openclaw name=" + pkg.name, "version=" + pkg.version); } catch (e) { console.log("package.json unreadable"); }
            try { const all = fs.readdirSync(d); const hits = all.filter(n => /delivery-queue/i.test(n));
              console.log("dist entries=" + all.length, "matching /^delivery-queue-[^/\\\\]+\\.js$/=" + hits.filter(n => /^delivery-queue-[^/\\]+\.js$/.test(n)).length);
              hits.forEach(n => console.log("  " + n));
            } catch { console.log("dist unreadable"); }
          '

      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit --pretty false -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Compiled regression tests
        run: |
          node --test dist/src/agent-task-delivery.test.js
          node --test dist/src/ocr.test.js
          node --test dist/src/request-context.test.js
